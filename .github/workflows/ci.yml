name: CI

on:
  push:
    # perf/** 是压测分支：推一个这样的分支就等于「我要一份性能数据」。
    # 有了它就不必依赖 workflow_dispatch —— 后者要用带 token 的 API 或页面点，
    # 而「怎么触发」本身不该成为复现实验的门槛。
    branches: [ main, master, 'perf/**' ]
  pull_request:
  # 压测只在手动触发时跑（见文件末尾的 perf job）。
  workflow_dispatch:

# 构建命令全部收在 scripts/ci.sh 里，这里只声明「在哪个 runner 上跑哪一项」。
# 换 CI 平台时（Gitee Go / 云效 / Jenkins），改的是这一层的方言，脚本不动。

# 最小权限：CI 只需要读仓库。默认 token 的权限随仓库设置变化，
# 显式声明才能保证「在别的仓库里复制这份配置」时行为一致。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Build & test
        run: bash scripts/ci.sh build

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Build & test (ASan/UBSan)
        run: bash scripts/ci.sh asan

  # 并发代码必须有 TSan 关卡：ASan 查不出数据竞争。
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Build & test (TSan)
        run: bash scripts/ci.sh tsan

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          # clang-format 必须钉版本：同一份代码在不同版本下的输出并不相同
          # （选项默认值、换行策略都改过）。CI 用 apt 的最新版、开发者用本地版本，
          # 结果就是「本地格式化完 CI 仍然报差异」，门禁变成永远过不去的墙。
          python -m pip install --user "clang-format==23.1.3"
          # pip --user 装到 ~/.local/bin，该目录默认不在 runner 的 PATH 里。
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Format & static analysis
        run: bash scripts/ci.sh lint

  # 覆盖率是唯一能发现「测试还在跑、但已经碰不到新分支」的关卡。
  # 其余三个 job 只能说「跑到的都对了」，说不了「该跑的都跑了」。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Install gcovr
        run: |
          # 版本要钉住。「gcovr>=6」看着无害，实际是每次 CI 都拉当时的最新版，
          # 而 gcovr 的解析行为在 8.x 里改过多次（遇到认不出的 gcov 输出行，
          # 从警告变成抛异常退出）。工具版本漂移会让同一个提交两次跑出不同结果——
          # 这不是「CI 坏了」，是「门禁的判据在变」。
          # 8.8 是本机能装到、并用来做过解析行为实测的版本；钉它而非「最新版」，
          # 图的是判据可复现，不是声称它比别的版本更好。
          python -m pip install --user "gcovr==8.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # 版本号做成注解：数字要能被核对，工具版本也是数字的一部分。
          # 注意两点：① GITHUB_PATH 只对**后续步骤**生效，同一步里直接写
          # `gcovr --version` 会是 command not found（注解变空还不报错），
          # 所以用 `python -m gcovr` 绕开 PATH；② 管道要放在 $( ) 里面。
          echo "::notice title=gcovr::$(python -m gcovr --version 2>&1 | head -1)"
      - name: Coverage gate
        run: bash scripts/ci.sh coverage
      # 报告必须在失败时也留下来：日志要仓库权限才看得到，
      # 而 job summary 在运行页面上直接可见，这是匿名能读到的唯一出口。
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f build-cov/coverage.txt ]; then
            echo "没有生成 build-cov/coverage.txt（构建或 gcovr 阶段就失败了）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 行覆盖率（src/ + include/）"
            echo ''
            echo '```'
            cat build-cov/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 再把 TOTAL 行做成一条注解。注解是唯一能用匿名 API 读到的产物：
      #   GET /repos/{owner}/{repo}/check-runs/{id}/annotations
      - name: Coverage annotation
        if: always()
        run: |
          if [ -f build-cov/coverage.txt ]; then
            # 日志接口要 admin 权限，页面又要人肉看——数字要能被机器取走才算可观测。
            echo "::notice title=行覆盖率::$(grep '^TOTAL' build-cov/coverage.txt | tail -1)"
          fi
          # 失败原因同样要能匿名读到。之前这里只在成功时有注解，
          # 于是 coverage 一红，匿名能看到的只有「exit code 1」——
          # 排查方向完全无从下手（和 perf job 那次踩的是同一个坑）。
          #
          # 两种失败要分开说：
          #   · 有 TOTAL 但没达标 -> 门槛问题，数字本身是对的，ci.sh 已经报了注解
          #   · 连 TOTAL 都没有   -> gcovr 阶段就炸了，原因只在它的日志里
          if [ -f build-cov/gcovr.log ] && ! grep -q '^TOTAL' build-cov/coverage.txt 2>/dev/null; then
            echo "::error title=coverage::$(grep -E 'ERROR|Unrecognized|Traceback|Exception during' build-cov/gcovr.log | head -3 | tr '\n' ' ' | cut -c1-800)"
          fi

  # libFuzzer 只随 clang 提供，gcc 侧没有等价物（AFL++ 是另一套工具链）。
  # 每个目标跑 30 秒：CI 要的是「有没有一撞就崩」，深度 fuzz 是本地/夜间的事。
  # 这三个目标不是随便挑的——json / url / HTTP 解析器是全部「手写解析不可信输入」的地方，
  # 其余模块吃的是自己进程内的数据，攻击面完全不同。
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 镜像事实先写进注解再动手。原因：ubuntu-latest 自 2026-10 起逐步迁到 Ubuntu 26，
      # 不同 runner 上装了什么并不一致，靠猜只会一轮一轮试。
      # 这一步永远成功（全部 || true），失败信息以 notice 的形式带出来。
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Probe toolchain
        run: |
          {
            echo "os=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "cmake=$(cmake --version 2>&1 | head -1)"
            echo "gcc=$(g++ --version 2>&1 | head -1)"
            echo "clang=$(clang++ --version 2>&1 | head -1)"
            echo "openssl=$(openssl version 2>&1 | head -1)"
            echo "bins=$(ls /usr/bin/clang* 2>/dev/null | head -3 | tr '\n' ' ')"
          } | tee /tmp/probe.txt
          echo "::notice title=probe::$(tr '\n' '|' < /tmp/probe.txt)"
      - name: Ensure clang
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update || echo "APT UPDATE FAILED"
            sudo apt-get install -y clang || echo "APT INSTALL FAILED"
          fi
          echo "::notice title=clang::$( (clang++ --version 2>&1 | head -1) || echo MISSING)"
      - name: Build & run fuzzers
        run: bash scripts/ci.sh fuzz

  # 性能数据刻意**不进** push / PR 流水线，两个理由：
  #   1. 共享 runner 的 vCPU 会被邻居抢，同一个提交两次跑能差 20%。放进每次 PR
  #      只会训练大家忽略这个数字，那比没有数字更糟。
  #   2. 它要跑 3 套配置 × 3 轮，比其余六个 job 加起来还慢。
  #
  # 结果走注解：和覆盖率同一条通道，匿名 API 就能取——
  #   GET /repos/{owner}/{repo}/check-runs/{id}/annotations
  # 注解里必须带上是共享 runner 这件事。单独一个 "p99=95us" 会被读成
  # 「这台机器上能跑 95us」，而它只是「这台共享机器、这一刻、没被邻居挤」。
  perf:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/perf/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 节点间 TLS 需要 OpenSSL 头文件。镜像里通常已有，但「通常」不是保证
      # （ubuntu-latest 正在往 26 迁，装了什么会变），所以缺了就直接装，不靠猜。
      - name: Ensure libssl-dev
        run: dpkg -s libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - name: Build & benchmark
        # 入口和本地完全一致（scripts/ci.sh perf）：构建参数、集群参数、轮次
        # 都收在脚本里，这一层只负责「在哪台机器上跑」。
        # pipefail：`| tee` 会把脚本的退出码吞掉，不加这一句的话
        # 「集群没起来」在页面上看起来和成功一模一样。
        run: |
          set -o pipefail
          bash scripts/ci.sh perf 2>&1 | tee perf.log
      - name: Results
        if: always()
        run: |
          if [ ! -f perf.log ]; then
            echo "没有 perf.log（构建或压测阶段就失败了）"
            echo "没有生成 perf.log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### 压测（GitHub 共享 runner）'
            echo ''
            echo '> 绝对 QPS 不可迁移：共享 vCPU 会被邻居抢占。同一提交重复跑也会漂。'
            echo '> 能看的是**同一份报告内部**的相对差异（全命中 vs 会淘汰、单节点 vs 三节点）。'
            echo ''
            echo '```'
            grep -E '^(os|cpu|reps|----|     qps)' perf.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^BENCH_SUMMARY' perf.log | while IFS= read -r line; do
            echo "::notice title=bench::${line#BENCH_SUMMARY }"
          done
          # 失败原因也走注解。日志要 admin 权限才看得到，而 job summary 页面要人肉翻——
          # perf 失败过一次，匿名 API 只能看到一个「exit code 1」，原因完全无从下手。
          # 这一层是兜底：bench_perf.sh 自己也会发注解，但构建失败等路径走不到那里。
          grep -E '^(BENCH_FAILED|节点在|提示：)' perf.log | head -6 | while IFS= read -r line; do
            echo "::error title=perf-log::${line}"
          done
