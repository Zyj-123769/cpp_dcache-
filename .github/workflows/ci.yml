name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan/UBSan)
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DDCACHE_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # 并发代码必须有 TSan 关卡：ASan 查不出数据竞争。
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DDCACHE_SANITIZE=thread
      - name: Build
        run: cmake --build build-tsan -j
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy
      - name: Format check
        run: |
          find include src apps tests -name '*.hpp' -o -name '*.cpp' -o -name '*.tpp' \
            | xargs clang-format --dry-run --Werror
      - name: Static analysis
        run: |
          cmake -S . -B build-lint -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build-lint $(find src apps -name '*.cpp')
